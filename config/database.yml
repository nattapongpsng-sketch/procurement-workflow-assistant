# PostgreSQL everywhere (Requirement.md NFR-01).
# Connection settings come from the environment (see .env.example); defaults
# match the `db` service in compose.yaml. Back up with script/backup_db.
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: workflow_development
  queue:
    <<: *default
    database: workflow_development_queue
    migrations_paths: db/queue_migrate

test:
  <<: *default
  database: workflow_test

# Production reads DATABASE_URL (primary) and the *_DATABASE_URL variables below.
production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    database: workflow_production
  cache:
    <<: *primary_production
    url: <%= ENV["CACHE_DATABASE_URL"] %>
    database: workflow_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
    database: workflow_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    url: <%= ENV["CABLE_DATABASE_URL"] %>
    database: workflow_production_cable
    migrations_paths: db/cable_migrate
